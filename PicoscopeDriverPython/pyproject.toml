[project]
name = "picoscope-driver"
version = "0.1.0"
description = "Python GEECS device driver for the PicoScope 3000A series"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hardware = ["picosdk>=1.1"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
picoscope-driver = "picoscope_driver.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picoscope_driver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Real-hardware tests are opt-in only: `PICOSCOPE_HW_TEST=1 pytest -m hardware`.
# The default run (plain `pytest`) never touches a physical PicoScope.
addopts = "-m 'not hardware'"
markers = [
    "hardware: needs a real PicoScope 3000A + PicoSDK (PICOSCOPE_HW_TEST=1 to run)",
]
