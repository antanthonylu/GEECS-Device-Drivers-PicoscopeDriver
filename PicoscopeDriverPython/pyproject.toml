[project]
name = "picoscope-driver"
version = "0.1.0"
description = "Python GEECS device driver for the PicoScope 3000A series"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
hardware = ["picosdk>=1.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.scripts]
picoscope-driver = "picoscope_driver.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["picoscope_driver*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
